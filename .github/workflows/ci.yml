# Integración continua: cada push y PR pasa lint, tipos, tests y build.
# Lighthouse CI, Playwright y axe se añaden en T-07 (semana 2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build
        env:
          # El build no conecta a la base de datos; solo valida el formato.
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
