# Integración continua: cada push y PR pasa lint, tipos, tests y build.
# El job `calidad` (T-07) añade pruebas e2e con axe y Lighthouse CI con
# los presupuestos de la constitución (02) y ADR-15.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build
        env:
          # El build no conecta a la base de datos; solo valida el formato.
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          # Secreto de prueba, solo para CI (no protege nada real).
          BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

  # Desde T-13 las páginas de noticias leen MySQL: se levanta la base con
  # los datos de demo para que e2e y Lighthouse midan páginas reales.
  calidad:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: florensia
          MYSQL_USER: florensia
          MYSQL_PASSWORD: florensia
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # Bandeja de correo de pruebas: las e2e de cuentas (RF-03) leen de aquí
      # los enlaces de verificación y de recuperación.
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: mysql://florensia:florensia@127.0.0.1:3306/florensia
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_URL: http://127.0.0.1:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate && pnpm db:seed && pnpm db:seed:demo
      - run: pnpm build
      # Accesibilidad (axe, WCAG 2.2 AA), i18n y diseño responsive.
      - run: pnpm test:e2e
      # Core Web Vitals de laboratorio contra los presupuestos.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-calidad
          path: |
            .lighthouseci
            playwright-report
          retention-days: 14

  # T-10: las migraciones se aplican sobre un MySQL 8.4 vacío, los datos de
  # referencia y de demo se cargan sin errores y el diagrama ER está al día.
  base-de-datos:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: florensia
          MYSQL_USER: florensia
          MYSQL_PASSWORD: florensia
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://florensia:florensia@127.0.0.1:3306/florensia
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # Dos veces: la carga de referencia debe ser idempotente.
      - run: pnpm db:seed && pnpm db:seed
      - run: pnpm db:seed:demo
      - name: El diagrama ER coincide con el esquema
        run: pnpm db:er && pnpm exec prettier --write docs/db/modelo-er.md && git diff --exit-code docs/db/modelo-er.md
